<!DOCTYPE html>
<html lang="en" data-theme="dark" data-board="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1b1838">
  <meta name="description" content="Tic Tac Toe from 3x3 to 12x12 with a 200-level campaign, smart AI, coins, shop and offline play.">
  <title>Tic Tac Toe</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="app" id="app">
    <!-- Shared top bar (pages set the title; the game page hides it) -->
    <header class="app-bar" id="appBar">
      <div class="app-bar-left">
        <button class="icon-btn" id="appBack" aria-label="Back" hidden><i data-lucide="arrow-left"></i></button>
        <button class="coin-pill" data-coin-pill data-go="#/shop" aria-label="Coins, open shop"><i data-lucide="coins"></i><span class="coin-amt">0</span></button>
      </div>
      <h1 class="page-title" id="appTitle"></h1>
      <div class="app-bar-right">
        <span id="appExtra"></span>
        <button class="icon-btn" id="appSettings" data-go="#/settings" aria-label="Settings"><i data-lucide="settings"></i></button>
      </div>
    </header>

    <!-- Pages are mounted here by the router -->
    <main class="page-host" id="pageHost"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Main">
      <button class="nav-btn" data-tab="home" data-go="#/home"><i data-lucide="house"></i>Home</button>
      <button class="nav-btn" data-tab="levels" data-go="#/levels"><i data-lucide="map"></i>Levels</button>
      <button class="nav-btn" data-tab="profile" data-go="#/profile"><i data-lucide="user"></i>Profile</button>
    </nav>
  </div>

  <div class="overlay" id="sheetBackdrop"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="splash" id="splash" aria-hidden="true">
    <svg class="logo" viewBox="0 0 120 120">
      <path class="grid-line draw d1" pathLength="100" d="M44 10 V110"/>
      <path class="grid-line draw d2" pathLength="100" d="M76 10 V110"/>
      <path class="grid-line draw d3" pathLength="100" d="M10 44 H110"/>
      <path class="grid-line draw d4" pathLength="100" d="M10 76 H110"/>
      <path class="lx draw d5" pathLength="100" d="M16 16 L38 38"/>
      <path class="lx draw d6" pathLength="100" d="M38 16 L16 38"/>
      <circle class="lo draw d7" pathLength="100" cx="93" cy="93" r="11" transform="rotate(-90 93 93)"/>
    </svg>
    <p class="splash-title">Tic Tac Toe</p>
  </div>

  <noscript><p class="noscript">This game needs JavaScript to run.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
