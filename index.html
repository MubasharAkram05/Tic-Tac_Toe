<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe — vs. the Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FFB6C1;
    --orange:#FFA07A;
    --teal:#20B2AA;
    --purple:#9370DB;
    --ink:#ffffff;
    --muted:rgba(255,255,255,0.75);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    background: linear-gradient(135deg, #FFB6C1, #FFA07A, #20B2AA, #9370DB);
    background-size: 400% 400%;
    animation: gradientBackground 10s ease infinite;
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 30px 16px;
    color: var(--ink);
  }
  @keyframes gradientBackground {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    width:100%;
    max-width:440px;
    text-align: center;
    background: rgba(255, 255, 255, 0.2);
    padding: 42px 32px 34px;
    border-radius: 35px;
    box-shadow: 0 35px 70px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 2px solid rgba(255, 255, 255, 0.3);
  }

  .masthead{ margin-bottom:26px; }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.85);
    font-weight:600;
    margin-bottom:12px;
  }
  h1 {
    margin: 0;
    color: #ffffff;
    font-size: 2.6rem;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
  }
  h1 em{
    font-style:normal;
    background: linear-gradient(135deg, #ffffff, #FFE29A);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }
  .tagline{
    margin:10px 0 0;
    font-size:13px;
    color:rgba(255,255,255,0.85);
    font-weight:500;
  }
  .mode-seg{
    display:inline-flex;
    margin:20px auto 0;
  }
  .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.8);
    white-space:nowrap;
  }
  .header-option{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    margin-top:18px;
  }

  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(40,20,55,0.45);
    backdrop-filter: blur(4px);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    width:100%;
    max-width:340px;
    text-align:center;
    background:rgba(255,255,255,0.25);
    padding:32px 28px;
    border-radius:28px;
    box-shadow:0 35px 70px rgba(0,0,0,0.4);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border:2px solid rgba(255,255,255,0.35);
    position:relative;
  }
  .modal-card .eyebrow{ margin-bottom:6px; }
  .modal-card h2{
    margin:0 0 22px;
    font-size:1.4rem;
    font-weight:800;
    color:#ffffff;
    text-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .modal-field{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
  }
  .result-icon{
    font-size:3rem;
    margin-bottom:8px;
  }
  .result-sub{
    margin:0 0 20px;
    font-size:13px;
    color:rgba(255,255,255,0.85);
  }
  .modal-close-btn{
    width:100%;
    margin-top:10px;
    background:transparent;
    border:1.5px solid rgba(255,255,255,0.5);
    color:#ffffff;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.04em;
    padding:12px;
    border-radius:40px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .modal-close-btn:hover{
    background:rgba(255,255,255,0.15);
  }

  .status-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:24px;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    letter-spacing:0.04em;
    padding:8px 16px;
    border-radius:100px;
    background:rgba(255,255,255,0.22);
    border:1px solid rgba(255,255,255,0.35);
    color:#ffffff;
    backdrop-filter: blur(6px);
  }
  .pill .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:#ffffff;
  }
  .pill.thinking .dot{
    animation:pulse 1s infinite ease-in-out;
  }
  @keyframes pulse{
    0%,100%{opacity:0.35; transform:scale(0.85);}
    50%{opacity:1; transform:scale(1.15);}
  }
  #status-text{ color:#ffffff; font-weight:700; }

  .board-wrap{
    position:relative;
    width:min(100%, 340px);
    margin:0 auto;
  }
  .board{
    position:relative;
    width:100%;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(3, 1fr);
    gap:16px;
  }
  .cell {
    aspect-ratio: 1/1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #FFA07A, #20B2AA);
    border-radius: 22px;
    cursor: pointer;
    transition: all 0.4s ease;
    box-shadow: 0 16px 28px rgba(0, 0, 0, 0.28), inset 0 -8px 16px rgba(255, 255, 255, 0.35), inset 0 8px 16px rgba(0, 0, 0, 0.12);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.3);
  }
  .cell:hover:not(.taken):not(.disabled) {
    background: linear-gradient(135deg, #20B2AA, #FFB6C1);
    transform: scale(1.08) rotate(3deg);
    box-shadow: 0 20px 36px rgba(0, 0, 0, 0.32), inset 0 -10px 20px rgba(255, 255, 255, 0.4), inset 0 10px 20px rgba(0, 0, 0, 0.15);
  }
  .cell:active:not(.taken):not(.disabled) {
    transform: scale(0.92) rotate(-3deg);
  }
  .cell.taken, .cell.disabled{ cursor:default; }
  .cell svg{
    width:50%;
    height:50%;
    overflow:visible;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
  }
  .cell .stroke{
    fill:none;
    stroke-width:10;
    stroke-linecap:round;
    animation:draw 0.32s ease forwards;
  }
  .cell.x .stroke{
    stroke:#ffffff;
    stroke-dasharray:180;
    stroke-dashoffset:180;
  }
  .cell.o .stroke{
    stroke:#FFE29A;
    stroke-dasharray:216;
    stroke-dashoffset:216;
  }
  @keyframes draw{
    to{ stroke-dashoffset:0; }
  }
  .cell.win{
    background: linear-gradient(135deg, #9370DB, #FFB6C1);
    border-color: #ffffff;
  }

  .win-line{
    position:absolute;
    height:4px;
    border-radius:4px;
    background:#ffffff;
    box-shadow:0 0 16px rgba(255,255,255,0.9);
    transform-origin:left center;
    left:0; top:0;
    width:0;
    pointer-events:none;
    transition:width 0.35s ease;
  }

  .controls{
    margin-top:26px;
  }
  .control-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 0;
    border-top:1px solid rgba(255,255,255,0.25);
  }
  .name-input{
    width:100%;
    max-width:100%;
    background:rgba(255,255,255,0.25);
    border:1px solid rgba(255,255,255,0.4);
    border-radius:100px;
    padding:9px 16px;
    font-family:inherit;
    font-size:13px;
    color:#ffffff;
    outline:none;
    text-align:center;
    backdrop-filter: blur(6px);
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .name-input:focus{
    border-color:#ffffff;
    background:rgba(255,255,255,0.32);
  }
  .name-input::placeholder{
    color:rgba(255,255,255,0.7);
  }
  .seg{
    display:flex;
    background:rgba(255,255,255,0.2);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:100px;
    padding:3px;
    gap:2px;
    backdrop-filter: blur(6px);
  }
  .seg-btn{
    background:transparent;
    border:none;
    color:rgba(255,255,255,0.85);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    padding:7px 14px;
    border-radius:100px;
    cursor:pointer;
    text-align:center;
    flex:1;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .seg-btn.active{
    background:linear-gradient(135deg, #9370DB, #FFB6C1);
    color:#ffffff;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
  }
  .seg-btn:hover:not(.active){
    color:#ffffff;
  }

  #restartButton, .reset-btn {
    width:100%;
    margin-top:22px;
    padding: 16px 40px;
    font-size: 1rem;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color: #fff;
    background: linear-gradient(135deg, #9370DB, #FFB6C1, #20B2AA, #FFA07A);
    background-size: 200% 200%;
    animation: gradientButton 5s ease infinite;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.4s ease;
    box-shadow: 0 16px 30px rgba(0, 0, 0, 0.3);
    font-family:inherit;
  }
  @keyframes gradientButton {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .reset-btn:hover{
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 20px 38px rgba(0, 0, 0, 0.35);
  }
  .reset-btn:active{
    transform: translateY(0) scale(1);
    box-shadow: 0 12px 22px rgba(0, 0, 0, 0.25);
  }

  .btn-row{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  .btn-row .reset-btn{
    margin-top:0;
    flex:2;
  }
  .reset-scores-btn{
    flex:1;
    background:rgba(255,255,255,0.18);
    border:1.5px solid rgba(255,255,255,0.5);
    color:#ffffff;
    font-family:inherit;
    font-size:0.85rem;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    border-radius:40px;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .reset-scores-btn:hover{
    background:rgba(255,255,255,0.3);
    transform: translateY(-2px);
  }
  .reset-scores-btn:active{
    transform: translateY(0);
  }

  .modal-x-btn{
    position:absolute;
    top:14px;
    right:14px;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.15);
    color:#ffffff;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background 0.15s ease;
  }
  .modal-x-btn:hover{
    background:rgba(255,255,255,0.3);
  }

  .scoreboard{
    margin-top:24px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  .score-item{
    text-align:center;
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:16px;
    padding:14px 4px;
    backdrop-filter: blur(6px);
  }
  .score-item .num{
    font-size:24px;
    font-weight:800;
    color:#ffffff;
  }
  .score-item .lbl{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.8);
    margin-top:4px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="masthead">
    <div class="eyebrow">You vs. an unbeaten mind</div>
    <h1>Tic-Tac-<em>Toe</em></h1>
    <p class="tagline">Outsmart the machine, one square at a time</p>
    <div class="seg mode-seg" id="mode-group">
      <button class="seg-btn active" data-mode="computer">vs Computer</button>
      <button class="seg-btn" data-mode="friend">vs Friend</button>
    </div>
  </div>

  <div class="status-row">
    <span class="pill" id="status-pill"><span class="dot"></span><span id="status-text">Your move</span></span>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="win-line" id="win-line"></div>
  </div>

  <div class="controls">
    <div class="control-row" id="difficulty-row">
      <span class="label">Difficulty</span>
      <div class="seg" id="difficulty-group">
        <button class="seg-btn" data-level="easy">Easy</button>
        <button class="seg-btn active" data-level="medium">Medium</button>
        <button class="seg-btn" data-level="hard">Hard</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="reset-btn" id="reset-btn">New Game</button>
      <button class="reset-scores-btn" id="reset-scores-btn">Reset</button>
    </div>
  </div>

  <div class="scoreboard">
    <div class="score-item x">
      <div class="num" id="score-x">0</div>
      <div class="lbl" id="label-x">You</div>
    </div>
    <div class="score-item">
      <div class="num" id="score-draw">0</div>
      <div class="lbl">Draws</div>
    </div>
    <div class="score-item o">
      <div class="num" id="score-o">0</div>
      <div class="lbl" id="label-o">Machine</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="names-modal">
  <div class="modal-card">
    <button class="modal-x-btn" id="names-x-btn" aria-label="Close">✕</button>
    <div class="eyebrow">Before you begin</div>
    <h2>Who's playing?</h2>
    <div class="modal-field">
      <span class="label">Player 1 (X)</span>
      <input type="text" id="player1-input" class="name-input" placeholder="Player 1" maxlength="14">
    </div>
    <div class="modal-field">
      <span class="label">Player 2 (O)</span>
      <input type="text" id="player2-input" class="name-input" placeholder="Player 2" maxlength="14">
    </div>
    <button class="reset-btn" id="names-start-btn">Start Game</button>
    <button class="modal-close-btn" id="names-cancel-btn">Close</button>
  </div>
</div>

<div class="modal-overlay" id="result-modal">
  <div class="modal-card">
    <div class="result-icon" id="result-icon">🎉</div>
    <h2 id="result-title">You Win!</h2>
    <p class="result-sub" id="result-sub">Nice moves.</p>
    <button class="reset-btn" id="result-play-again-btn">Play Again</button>
    <button class="modal-close-btn" id="result-close-btn">Close</button>
  </div>
</div>

<script>
(function(){
  const boardEl = document.getElementById('board');
  const statusPill = document.getElementById('status-pill');
  const statusText = document.getElementById('status-text');
  const resetBtn = document.getElementById('reset-btn');
  const modeGroup = document.getElementById('mode-group');
  const difficultyGroup = document.getElementById('difficulty-group');
  const difficultyRow = document.getElementById('difficulty-row');
  const namesModal = document.getElementById('names-modal');
  const resultModal = document.getElementById('result-modal');
  const resultIcon = document.getElementById('result-icon');
  const resultTitle = document.getElementById('result-title');
  const resultSub = document.getElementById('result-sub');
  const resultPlayAgainBtn = document.getElementById('result-play-again-btn');
  const resultCloseBtn = document.getElementById('result-close-btn');
  const player1Input = document.getElementById('player1-input');
  const player2Input = document.getElementById('player2-input');
  const namesStartBtn = document.getElementById('names-start-btn');
  const namesXBtn = document.getElementById('names-x-btn');
  const namesCancelBtn = document.getElementById('names-cancel-btn');
  const resetScoresBtn = document.getElementById('reset-scores-btn');
  const scoreXEl = document.getElementById('score-x');
  const scoreOEl = document.getElementById('score-o');
  const scoreDrawEl = document.getElementById('score-draw');
  const labelXEl = document.getElementById('label-x');
  const labelOEl = document.getElementById('label-o');
  const winLineEl = document.getElementById('win-line');
  const boardWrap = document.querySelector('.board-wrap');

  let board = Array(9).fill(null);
  let humanMark = 'X';
  let aiMark = 'O';
  let difficulty = 'medium';
  let mode = 'computer';
  let player1Name = 'Player 1';
  let player2Name = 'Player 2';
  let pendingReset = false;
  let gameOver = false;
  let scores = { X: 0, O: 0, draw: 0 };

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const X_SVG = '<svg viewBox="0 0 100 100"><path class="stroke" d="M20,20 L80,80"/><path class="stroke" d="M80,20 L20,80"/></svg>';
  const O_SVG = '<svg viewBox="0 0 100 100"><circle class="stroke" cx="50" cy="50" r="34"/></svg>';

  function buildBoard(){
    boardEl.innerHTML = '';
    for(let i=0;i<9;i++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.addEventListener('click', onCellClick);
      boardEl.appendChild(cell);
    }
  }

  function render(){
    const cells = boardEl.children;
    for(let i=0;i<9;i++){
      const cell = cells[i];
      cell.classList.remove('x','o');
      cell.innerHTML = '';
      cell.classList.toggle('taken', !!board[i]);
      if(board[i] === 'X'){
        cell.classList.add('x');
        cell.innerHTML = X_SVG;
      } else if(board[i] === 'O'){
        cell.classList.add('o');
        cell.innerHTML = O_SVG;
      }
    }
  }

  function checkWinner(b){
    for(const line of WIN_LINES){
      const [a,c,d] = line;
      if(b[a] && b[a]===b[c] && b[a]===b[d]){
        return { mark:b[a], line };
      }
    }
    if(b.every(v=>v!==null)) return { mark:'draw', line:null };
    return null;
  }

  function onCellClick(e){
    if(gameOver) return;
    const idx = parseInt(e.currentTarget.dataset.index);
    if(board[idx]) return;

    if(mode === 'friend'){
      const turn = currentTurn();
      board[idx] = turn;
      render();
      const result = checkWinner(board);
      if(result){ endGame(result); return; }
      const next = turn === 'X' ? 'O' : 'X';
      statusText.textContent = (next === 'X' ? player1Name : player2Name) + "'s move";
      return;
    }

    if(currentTurn() !== humanMark) return;

    board[idx] = humanMark;
    render();
    const result = checkWinner(board);
    if(result){ endGame(result); return; }

    setThinking(true);
    setDisabled(true);
    setTimeout(()=>{
      aiMove();
      setDisabled(false);
      setThinking(false);
    }, 400);
  }

  function currentTurn(){
    const filled = board.filter(v=>v!==null).length;
    return filled % 2 === 0 ? 'X' : 'O';
  }

  function setDisabled(disabled){
    Array.from(boardEl.children).forEach(c=>c.classList.toggle('disabled', disabled));
  }

  function setThinking(isThinking){
    statusPill.classList.toggle('thinking', isThinking);
    statusText.textContent = isThinking ? 'Machine is thinking' : statusText.textContent;
  }

  function aiMove(){
    if(gameOver) return;
    let idx;
    if(difficulty === 'easy'){
      idx = randomMove();
    } else if(difficulty === 'medium'){
      idx = Math.random() < 0.5 ? bestMove() : randomMove();
    } else {
      idx = bestMove();
    }
    board[idx] = aiMark;
    render();
    const result = checkWinner(board);
    if(result){ endGame(result); return; }
    statusText.textContent = 'Your move';
  }

  function randomMove(){
    const empties = board.map((v,i)=>v===null?i:null).filter(v=>v!==null);
    return empties[Math.floor(Math.random()*empties.length)];
  }

  function bestMove(){
    let bestScore = -Infinity;
    let move = null;
    for(let i=0;i<9;i++){
      if(board[i]===null){
        board[i] = aiMark;
        const score = minimax(board, 0, false);
        board[i] = null;
        if(score > bestScore){
          bestScore = score;
          move = i;
        }
      }
    }
    return move;
  }

  function minimax(b, depth, isMaximizing){
    const result = checkWinner(b);
    if(result){
      if(result.mark === aiMark) return 10 - depth;
      if(result.mark === humanMark) return depth - 10;
      return 0;
    }
    if(isMaximizing){
      let best = -Infinity;
      for(let i=0;i<9;i++){
        if(b[i]===null){
          b[i] = aiMark;
          best = Math.max(best, minimax(b, depth+1, false));
          b[i] = null;
        }
      }
      return best;
    } else {
      let best = Infinity;
      for(let i=0;i<9;i++){
        if(b[i]===null){
          b[i] = humanMark;
          best = Math.min(best, minimax(b, depth+1, true));
          b[i] = null;
        }
      }
      return best;
    }
  }

  function drawWinLine(line){
    const cells = boardEl.children;
    const startCell = cells[line[0]];
    const endCell = cells[line[2]];
    const wrapRect = boardWrap.getBoundingClientRect();
    const r1 = startCell.getBoundingClientRect();
    const r2 = endCell.getBoundingClientRect();

    const x1 = r1.left + r1.width/2 - wrapRect.left;
    const y1 = r1.top + r1.height/2 - wrapRect.top;
    const x2 = r2.left + r2.width/2 - wrapRect.left;
    const y2 = r2.top + r2.height/2 - wrapRect.top;

    const dx = x2 - x1, dy = y2 - y1;
    const length = Math.sqrt(dx*dx + dy*dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;

    winLineEl.style.left = x1 + 'px';
    winLineEl.style.top = y1 + 'px';
    winLineEl.style.transform = `rotate(${angle}deg)`;
    winLineEl.style.width = '0px';
    requestAnimationFrame(()=>{
      winLineEl.style.width = length + 'px';
    });
  }

  function endGame(result){
    gameOver = true;
    setDisabled(true);
    statusPill.classList.remove('thinking');
    let icon = '🎉', title = '', sub = '';

    if(result.mark === 'draw'){
      statusText.textContent = "It's a draw";
      scores.draw++;
      icon = '🤝';
      title = "It's a Draw!";
      sub = 'Evenly matched — go again?';
    } else {
      if(result.line){
        result.line.forEach(i=> boardEl.children[i].classList.add('win'));
        drawWinLine(result.line);
      }
      if(mode === 'friend'){
        const winnerName = result.mark === 'X' ? player1Name : player2Name;
        statusText.textContent = winnerName + ' wins';
        title = winnerName + ' Wins!';
        sub = 'Three in a row — well played.';
      } else if(result.mark === humanMark){
        statusText.textContent = 'You win';
        title = 'You Win!';
        sub = 'You outsmarted the machine.';
      } else {
        statusText.textContent = 'Machine wins';
        title = 'Machine Wins';
        icon = '🤖';
        sub = 'Better luck next round.';
      }
      scores[result.mark]++;
    }
    updateScoreboard();

    resultIcon.textContent = icon;
    resultTitle.textContent = title;
    resultSub.textContent = sub;
    setTimeout(()=>{ resultModal.classList.add('open'); }, 500);
  }

  function updateScoreboard(){
    scoreXEl.textContent = scores.X;
    scoreOEl.textContent = scores.O;
    scoreDrawEl.textContent = scores.draw;
  }

  function updateLabels(){
    if(mode === 'friend'){
      labelXEl.textContent = player1Name;
      labelOEl.textContent = player2Name;
    } else {
      labelXEl.textContent = humanMark === 'X' ? 'You' : 'Machine';
      labelOEl.textContent = humanMark === 'O' ? 'You' : 'Machine';
    }
  }

  function newGame(){
    board = Array(9).fill(null);
    gameOver = false;
    winLineEl.style.width = '0px';
    buildBoard();
    render();
    setDisabled(false);
    updateLabels();

    if(mode === 'friend'){
      statusText.textContent = player1Name + "'s move";
      return;
    }

    if(humanMark === 'O'){
      statusText.textContent = 'Machine opens';
      setThinking(true);
      setDisabled(true);
      setTimeout(()=>{
        aiMove();
        setDisabled(false);
        setThinking(false);
      }, 400);
    } else {
      statusText.textContent = 'Your move';
    }
  }

  modeGroup.addEventListener('click', (e)=>{
    const btn = e.target.closest('.seg-btn');
    if(!btn) return;
    mode = btn.dataset.mode;
    Array.from(modeGroup.children).forEach(b=>b.classList.toggle('active', b===btn));
    difficultyRow.style.display = mode === 'friend' ? 'none' : 'flex';
    if(mode === 'friend'){
      openNamesModal();
    } else {
      newGame();
    }
  });

  function openNamesModal(){
    resultModal.classList.remove('open');
    player1Input.value = player1Name === 'Player 1' ? '' : player1Name;
    player2Input.value = player2Name === 'Player 2' ? '' : player2Name;
    namesModal.classList.add('open');
    setDisabled(true);
    setTimeout(()=> player1Input.focus(), 50);
  }

  function closeNamesModal(){
    namesModal.classList.remove('open');
  }

  function cancelNamesModal(){
    closeNamesModal();
    if(pendingReset){
      pendingReset = false;
      if(!gameOver) setDisabled(false);
      return;
    }
    mode = 'computer';
    Array.from(modeGroup.children).forEach(b=>b.classList.toggle('active', b.dataset.mode === 'computer'));
    difficultyRow.style.display = 'flex';
    if(!gameOver) setDisabled(false);
  }

  function confirmNames(){
    const newP1 = player1Input.value.trim() || 'Player 1';
    const newP2 = player2Input.value.trim() || 'Player 2';
    const namesChanged = (newP1 !== player1Name) || (newP2 !== player2Name);
    player1Name = newP1;
    player2Name = newP2;
    updateLabels();
    closeNamesModal();
    if(namesChanged || pendingReset){
      scores = { X: 0, O: 0, draw: 0 };
      updateScoreboard();
    }
    pendingReset = false;
    newGame();
  }

  namesStartBtn.addEventListener('click', confirmNames);
  namesXBtn.addEventListener('click', cancelNamesModal);
  namesCancelBtn.addEventListener('click', cancelNamesModal);
  player1Input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') confirmNames(); });
  player2Input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') confirmNames(); });

  difficultyGroup.addEventListener('click', (e)=>{
    const btn = e.target.closest('.seg-btn');
    if(!btn) return;
    difficulty = btn.dataset.level;
    Array.from(difficultyGroup.children).forEach(b=>b.classList.toggle('active', b===btn));
  });

  resetBtn.addEventListener('click', newGame);

  resetScoresBtn.addEventListener('click', ()=>{
    if(mode === 'friend'){
      pendingReset = true;
      openNamesModal();
    } else {
      scores = { X: 0, O: 0, draw: 0 };
      updateScoreboard();
      newGame();
    }
  });

  resultPlayAgainBtn.addEventListener('click', ()=>{
    resultModal.classList.remove('open');
    newGame();
  });
  resultCloseBtn.addEventListener('click', ()=>{
    resultModal.classList.remove('open');
  });

  buildBoard();
  newGame();
})();
</script>

</body>
</html>
